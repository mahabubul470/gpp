# clap v3.0.0 -> v4.0.0 (616 first-parent commits).
# The instructive case: clap's internal reorganization (#3438, undocumented)
# flattens src/build/* long before 4.0 removes the APIs — file-anchored
# evidence dies at the reorg, which is a *true* "your file-level belief is
# stale" signal, but shows why span/symbol precision matters. The ArgEnum
# rename (#3799) is caught exactly; its removal is the documented #4127.
NAME=clap
URL=https://github.com/clap-rs/clap.git
OLD=c01ebbac17e3fdaf3b1d0bfb84051cd701babb7c   # tag v3.0.0
NEW=3a74d8237634979275d364c48228371e50bf8407   # tag v4.0.0

seed_beliefs() {
    # Evidence lines verified against the pinned v3.0.0 tree.
    belief 912a62907040caf50913d57745987f8f7af9cc43 "commit: Clarify ArgEnum as ValueEnum (#3799); removal documented in 4.0.0 changelog (#4127)" \
        "derive enums implement the ArgEnum trait" \
        --evidence src/derive.rs:399-399
    belief c422ed24df1b740a0b1342e678b05d04a609a6bf "internal reorg (#3438) — evidence file moved; App itself removed in 4.0" \
        "the builder entry point is struct App in src/build/app/mod.rs" \
        --evidence src/build/app/mod.rs:66-66
    belief c422ed24df1b740a0b1342e678b05d04a609a6bf "internal reorg (#3438) — evidence file moved; takes_value removed in 4.0 (actions)" \
        "Arg::takes_value opts an argument into taking a value" \
        --evidence src/build/arg/mod.rs:968-968
    # Control: the Apache license text is untouched across the whole range.
    belief SURVIVES "LICENSE-APACHE unchanged v3.0.0 -> v4.0.0" \
        "clap is dual-licensed Apache-2.0 OR MIT" \
        --evidence LICENSE-APACHE:1-2
}
